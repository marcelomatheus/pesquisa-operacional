services:
  api:
    build:
      context: ./backend
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "${PIVONAUTA_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
