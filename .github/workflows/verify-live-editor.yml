name: Verify published editor layout

on:
  push:
    branches: [audit/live-editor-visual-2026-11-22]

permissions:
  contents: read

jobs:
  live_editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium for live visual verification
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify six real responsive layouts against public domain
        run: node scripts/verify_live_editor.mjs
      - name: Archive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-editor-visual-evidence
          path: validation-artifacts/live-editor/
          if-no-files-found: ignore
          retention-days: 7
