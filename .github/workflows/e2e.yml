name: PivôNauta Browser E2E

on:
  push:
    branches: [main, 'test/**', 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Install frontend
        run: npm ci
      - name: Install Playwright without modifying the application lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real browser against FastAPI and Vite
        run: python scripts/run_e2e.py
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivonauta-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pdf_visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend and PDF visual tools
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "pymupdf>=1.24,<2"
      - name: Validate document generation, page bounds and rasterization
        run: python scripts/validate_pdf_visual.py
      - name: Publish PDF samples and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivonauta-pdf-preflight-${{ github.run_id }}
          path: validation-artifacts/pdf/
          if-no-files-found: ignore
          retention-days: 7

  production_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and start production-like frontend and API
        run: docker compose up -d --build --wait
      - name: Exercise public HTTP endpoints behind Nginx
        run: python scripts/smoke_production.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
