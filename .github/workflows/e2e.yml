name: PivôNauta Browser E2E

on:
  push:
    branches: [main, 'test/**', 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Install frontend
        run: npm ci
      - name: Install Playwright without modifying the application lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real browser against FastAPI and Vite
        run: python scripts/run_e2e.py
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivonauta-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pdf_visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend and PDF visual tools
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "pymupdf>=1.24,<2"
      - name: Validate document generation, page bounds and rasterization
        run: python scripts/validate_pdf_visual.py
      - name: Publish PDF samples and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivonauta-pdf-preflight-${{ github.run_id }}
          path: validation-artifacts/pdf/
          if-no-files-found: ignore
          retention-days: 7

  production_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and start production-like frontend and API
        run: docker compose up -d --build --wait
      - name: Exercise public HTTP endpoints behind Nginx
        run: python scripts/smoke_production.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  readonly_web:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated CI equivalent of shared proxy network
        run: docker network create celo-network
      - name: Build and start read-only production stack
        run: docker compose --env-file .env.production.example -f compose.production.yaml up -d --build --wait
      - name: Verify read-only Nginx process, writable temporary directories and stability
        run: |
          COMPOSE="docker compose --env-file .env.production.example -f compose.production.yaml"
          WEB_ID=$($COMPOSE ps -q web)
          test -n "$WEB_ID"
          test "$(docker inspect -f '{{.State.Health.Status}}' "$WEB_ID")" = healthy
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$WEB_ID")" = true
          test "$(docker inspect -f '{{.Config.User}}' "$WEB_ID")" = 101:101
          test "$(docker inspect -f '{{.RestartCount}}' "$WEB_ID")" = 0
          $COMPOSE exec -T web nginx -t
          $COMPOSE exec -T web sh -c '
            test "$(id -u)" = 101
            for directory in client_body proxy fastcgi uwsgi scgi; do
              test -w "/tmp/nginx/$directory" || exit 1
            done
            wget -q -O /dev/null http://127.0.0.1:18473/
            wget -q -O /dev/null http://127.0.0.1:18473/api/v1/health/ready
          '
          sleep 5
          test "$(docker inspect -f '{{.State.Health.Status}}' "$WEB_ID")" = healthy
          test "$(docker inspect -f '{{.RestartCount}}' "$WEB_ID")" = 0
      - name: Exercise frontend, Simplex and PDF on production network
        run: |
          docker run --rm --network celo-network \
            -v "$PWD/scripts:/workspace:ro" -w /workspace \
            -e PIVONAUTA_URL=http://web:18473 \
            python:3.13-alpine python3 smoke_production.py
      - name: Show production container logs on failure
        if: failure()
        run: docker compose --env-file .env.production.example -f compose.production.yaml logs --no-color
      - name: Stop isolated production environment
        if: always()
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml down --remove-orphans
          docker network rm celo-network || true
